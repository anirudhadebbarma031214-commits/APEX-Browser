name: Deploy ANI CHAT website

on:
  push:
    branches: [main]
    paths:
      - "ani-chat/**"
      - "index.html"
      - ".github/workflows/ani-chat-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ani-chat-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload ANI CHAT site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ani-chat
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
